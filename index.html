<style>
/* ────────────────────────────────────────
   RESET & TOKENS
──────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
:root{
  --ink:#1C0F06; --ink2:#3D2210; --ink3:#7A5535;
  --parchment:#FAF6F0; --cream:#F2EBE0; --warm:#E8DDD0;
  --gold:#C4973A; --gold2:#E8C47A; --gold3:#F5DFA0;
  --border:#DDD0BC; --border2:#C4B09A;
  --muted:#9A8268; --red:#B84B3C;
  --safe-b:env(safe-area-inset-bottom,0px);
  --panel:288px;
  --hdr:52px;
  --radius:12px;
}
body{font-family:'Gowun Dodum','Noto Serif KR',serif;color:var(--ink);background:var(--cream);display:flex;flex-direction:column}

/* ────────────────────────────────────────
   HEADER
──────────────────────────────────────── */
header{
  height:var(--hdr);flex-shrink:0;
  background:var(--ink);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:200;
  border-bottom:1px solid rgba(196,151,58,.25);
}
.logo{display:flex;align-items:center;gap:9px}
.logo-bean{
  width:32px;height:32px;
  background:none;
  display:flex;align-items:center;justify-content:center;font-size:32px;
  flex-shrink:0;
}
.logo-txt{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:var(--gold2);letter-spacing:.04em}
.logo-ver{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.14em;margin-top:1px}
.hdr-right{display:flex;gap:6px;align-items:center}
.hbtn{padding:7px 13px;border-radius:8px;font-family:'Gowun Dodum',serif;font-size:12px;cursor:pointer;border:none;transition:all .15s;letter-spacing:.02em}
.hbtn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.65)}
.hbtn-ghost:hover{border-color:var(--gold2);color:var(--gold2)}
.hbtn-gold{background:var(--gold);color:var(--ink);font-weight:700}
.hbtn-gold:hover{background:var(--gold2)}
.hbtn:active{opacity:.75;transform:scale(.97)}

/* ────────────────────────────────────────
   APP BODY
──────────────────────────────────────── */
.app{flex:1;display:flex;overflow:hidden;height:calc(100vh - var(--hdr))}

/* ────────────────────────────────────────
   3단계 표시바
──────────────────────────────────────── */

/* ────────────────────────────────────────
   캔버스 하단 컨트롤 바
──────────────────────────────────────── */
.canvas-ctrl-bar{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:600px;padding:0 4px;
  margin-top:6px;
}
.canvas-ctrl-left{
  display:flex;gap:5px;
}
.cctrl-btn{
  width:34px;height:34px;border-radius:10px;
  background:rgba(28,15,6,.12);backdrop-filter:blur(4px);
  border:1.5px solid var(--border);
  color:var(--ink2);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.cctrl-btn:hover{background:rgba(196,151,58,.18);border-color:var(--gold);color:var(--gold)}
.canvas-done-btn{
  padding:7px 18px;border-radius:10px;
  background:var(--gold);color:var(--ink);
  font-size:12px;font-weight:700;font-family:'Gowun Dodum',serif;
  border:none;cursor:pointer;transition:all .15s;
  box-shadow:0 2px 8px rgba(196,151,58,.35);letter-spacing:.04em;
}
.canvas-done-btn:hover{background:var(--gold2);transform:scale(1.03)}
.canvas-done-btn:active{transform:scale(.97)}


.canvas-zone{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:var(--warm);
  background-image:radial-gradient(circle at 25% 25%,rgba(196,151,58,.07) 0%,transparent 55%),
                   radial-gradient(circle at 75% 75%,rgba(28,15,6,.05) 0%,transparent 55%);
  padding:16px 20px;gap:10px;overflow:auto;position:relative;min-height:0;
}
.canvas-shell{
  margin-top:auto;margin-bottom:auto;
  flex-shrink:0;
  position:relative;
  box-shadow:0 8px 48px rgba(28,15,6,.22),0 2px 12px rgba(28,15,6,.12);
  border-radius:3px;overflow:hidden;cursor:move;
}
/* 캔버스 리사이즈 핸들 */
.canvas-resize-handle{
  position:absolute;width:16px;height:16px;z-index:20;
  background:#fff;border:2px solid #C4973A;border-radius:3px;
  cursor:nwse-resize;opacity:0.85;
}
.canvas-resize-handle.tl{top:-6px;left:-6px;cursor:nwse-resize;}
.canvas-resize-handle.tr{top:-6px;right:-6px;cursor:nesw-resize;}
.canvas-resize-handle.bl{bottom:-6px;left:-6px;cursor:nesw-resize;}
.canvas-resize-handle.br{bottom:-6px;right:-6px;cursor:nwse-resize;}
.canvas-resize-handle.tc{top:-6px;left:calc(50% - 8px);cursor:ns-resize;}
.canvas-resize-handle.bc{bottom:-6px;left:calc(50% - 8px);cursor:ns-resize;}
.canvas-resize-handle.ml{left:-6px;top:calc(50% - 8px);cursor:ew-resize;}
.canvas-resize-handle.mr{right:-6px;top:calc(50% - 8px);cursor:ew-resize;}
.canvas-shell.bg-direct-edit{overflow:visible}
.canvas-shell.bg-direct-edit .canvas-resize-handle{display:none!important}
#bgTransformBox{display:none;position:absolute;z-index:45;border:2px dashed #20b9a9;box-sizing:border-box;touch-action:none;cursor:move;background:rgba(78,205,196,.025)}
.canvas-shell.bg-direct-edit #bgTransformBox{display:block}
.bg-transform-handle{position:absolute;width:36px;height:36px;z-index:46;touch-action:none}
.bg-transform-handle::after{content:'';position:absolute;left:11px;top:11px;width:12px;height:12px;background:#fff;border:2px solid #20b9a9;border-radius:3px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.bg-transform-handle[data-dir=nw]{left:-18px;top:-18px;cursor:nwse-resize}.bg-transform-handle[data-dir=n]{left:calc(50% - 18px);top:-18px;cursor:ns-resize}.bg-transform-handle[data-dir=ne]{right:-18px;top:-18px;cursor:nesw-resize}
.bg-transform-handle[data-dir=w]{left:-18px;top:calc(50% - 18px);cursor:ew-resize}.bg-transform-handle[data-dir=e]{right:-18px;top:calc(50% - 18px);cursor:ew-resize}
.bg-transform-handle[data-dir=sw]{left:-18px;bottom:-18px;cursor:nesw-resize}.bg-transform-handle[data-dir=s]{left:calc(50% - 18px);bottom:-18px;cursor:ns-resize}.bg-transform-handle[data-dir=se]{right:-18px;bottom:-18px;cursor:nwse-resize}
#mainCanvas{display:block;touch-action:none}
@media(max-width:680px){
  /* ⚠ 캔버스 크기는 initCanvas() 가 outputW:outputH 비율에 맞춰 직접 계산한다.
     여기서 max-height 로 세로만 제한하면 가로는 그대로라 비율이 깨진다.
     따라서 CSS 는 가로 안전망만 두고 높이는 JS 에 맡긴다. */
  #mainCanvas{
