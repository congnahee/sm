<style>
/* ────────────────────────────────────────
   RESET & TOKENS
──────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
:root{
  --ink:#1C0F06; --ink2:#3D2210; --ink3:#7A5535;
  --parchment:#FAF6F0; --cream:#F2EBE0; --warm:#E8DDD0;
  --gold:#C4973A; --gold2:#E8C47A; --gold3:#F5DFA0;
  --border:#DDD0BC; --border2:#C4B09A;
  --muted:#9A8268; --red:#B84B3C;
  --safe-b:env(safe-area-inset-bottom,0px);
  --panel:288px;
  --hdr:52px;
  --radius:12px;
}
body{font-family:'Gowun Dodum','Noto Serif KR',serif;color:var(--ink);background:var(--cream);display:flex;flex-direction:column}

/* ────────────────────────────────────────
   HEADER
──────────────────────────────────────── */
header{
  height:var(--hdr);flex-shrink:0;
  background:var(--ink);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:200;
  border-bottom:1px solid rgba(196,151,58,.25);
}
.logo{display:flex;align-items:center;gap:9px}
.logo-bean{
  width:32px;height:32px;
  background:none;
  display:flex;align-items:center;justify-content:center;font-size:32px;
  flex-shrink:0;
}
.logo-txt{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:var(--gold2);letter-spacing:.04em}
.logo-ver{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.14em;margin-top:1px}
.hdr-right{display:flex;gap:6px;align-items:center}
.hbtn{padding:7px 13px;border-radius:8px;font-family:'Gowun Dodum',serif;font-size:12px;cursor:pointer;border:none;transition:all .15s;letter-spacing:.02em}
.hbtn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.65)}
.hbtn-ghost:hover{border-color:var(--gold2);color:var(--gold2)}
.hbtn-gold{background:var(--gold);color:var(--ink);font-weight:700}
.hbtn-gold:hover{background:var(--gold2)}
.hbtn:active{opacity:.75;transform:scale(.97)}

/* ────────────────────────────────────────
   APP BODY
──────────────────────────────────────── */
.app{flex:1;display:flex;overflow:hidden;height:calc(100vh - var(--hdr))}

/* ────────────────────────────────────────
   3단계 표시바
──────────────────────────────────────── */

/* ────────────────────────────────────────
   캔버스 하단 컨트롤 바
──────────────────────────────────────── */
.canvas-ctrl-bar{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:600px;padding:0 4px;
  margin-top:6px;
}
.canvas-ctrl-left{
  display:flex;gap:5px;
}
.cctrl-btn{
  width:34px;height:34px;border-radius:10px;
  background:rgba(28,15,6,.12);backdrop-filter:blur(4px);
  border:1.5px solid var(--border);
  color:var(--ink2);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.cctrl-btn:hover{background:rgba(196,151,58,.18);border-color:var(--gold);color:var(--gold)}
.canvas-done-btn{
  padding:7px 18px;border-radius:10px;
  background:var(--gold);color:var(--ink);
  font-size:12px;font-weight:700;font-family:'Gowun Dodum',serif;
  border:none;cursor:pointer;transition:all .15s;
  box-shadow:0 2px 8px rgba(196,151,58,.35);letter-spacing:.04em;
}
.canvas-done-btn:hover{background:var(--gold2);transform:scale(1.03)}
.canvas-done-btn:active{transform:scale(.97)}


.canvas-zone{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--warm);
  background-image:radial-gradient(circle at 25% 25%,rgba(196,151,58,.07) 0%,transparent 55%),
                   radial-gradient(circle at 75% 75%,rgba(28,15,6,.05) 0%,transparent 55%);
  padding:10px 20px;gap:10px;overflow:auto;position:relative;
}
.canvas-shell{
  position:relative;
  box-shadow:0 8px 48px rgba(28,15,6,.22),0 2px 12px rgba(28,15,6,.12);
  border-radius:3px;overflow:hidden;cursor:move;
}
/* 캔버스 리사이즈 핸들 */
.canvas-resize-handle{
  position:absolute;width:16px;height:16px;z-index:20;
  background:#fff;border:2px solid #C4973A;border-radius:3px;
  cursor:nwse-resize;opacity:0.85;
}
.canvas-resize-handle.tl{top:-6px;left:-6px;cursor:nwse-resize;}
.canvas-resize-handle.tr{top:-6px;right:-6px;cursor:nesw-resize;}
.canvas-resize-handle.bl{bottom:-6px;left:-6px;cursor:nesw-resize;}
.canvas-resize-handle.br{bottom:-6px;right:-6px;cursor:nwse-resize;}
#mainCanvas{display:block;touch-action:none}
@media(max-width:680px){
  #mainCanvas{max-width:calc(100vw - 16px) !important;max-height:min(calc(100vw - 16px), 70vh) !important;width:auto !important;height:auto !important}
}

/* 크롭 핸들 */
.crop-handle{
  position:absolute;width:10px;height:10px;
  background:#fff;border:1.5px solid rgba(0,0,0,0.5);
  border-radius:2px;
}

/* canvas hint */
.canvas-hint{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;pointer-events:none;opacity:.72;
}
.canvas-hint-char{width:40%;max-width:160px;object-fit:contain;display:block;filter:contrast(1.15) saturate(1.3)}
.canvas-hint-txt{font-size:13px;color:var(--ink3);text-align:center;line-height:1.6;margin-top:4px}

/* bottom size bar */
.size-bar{
  display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:center;
}
.size-chip{
  padding:6px 12px;border-radius:20px;font-size:11px;
  border:1.5px solid var(--border2);background:rgba(255,255,255,.6);
  color:var(--muted);cursor:pointer;transition:all .15s;
  backdrop-filter:blur(4px);font-family:'Gowun Dodum',serif;
}
.size-chip.active{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.size-chip:hover:not(.active){border-color:var(--ink3);color:var(--ink2)}

/* zoom +/- bar */
.zoom-bar{display:flex;align-items:center;gap:4px;margin-left:4px}
.zoom-btn{
  width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border2);
  background:rgba(255,255,255,.7);color:var(--ink);font-size:16px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;font-family:inherit;backdrop-filter:blur(4px);
  padding:0;
}
.zoom-btn:hover{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.zoom-pct{font-size:11px;color:var(--muted);min-width:36px;text-align:center;font-family:'Gowun Dodum',serif}

/* ────────────────────────────────────────
   RIGHT PANEL
──────────────────────────────────────── */
.panel{
  width:var(--panel);flex-shrink:0;
  background:var(--parchment);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.ptabs{display:flex;background:var(--cream);border-bottom:1px solid var(--border);flex-shrink:0}
.ptabs{display:flex;background:var(--ink);flex-shrink:0}
.ptab{
  flex:1;padding:11px 4px;text-align:center;font-size:13px;
  color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;letter-spacing:.03em;
}
.ptab.active{color:var(--gold2);border-bottom-color:var(--gold2);background:rgba(196,151,58,.12);font-weight:700}
.pcontent{flex:1;overflow-y:auto;overflow-x:hidden}
.pcontent::-webkit-scrollbar{width:3px}
.pcontent::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.pane{display:none;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom, 20px) + 60px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.pane.active{display:block}

/* ────────────────────────────────────────
   SECTION LABEL
──────────────────────────────────────── */
.slabel{
  font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.18em;
  text-transform:uppercase;margin-bottom:8px;margin-top:1
